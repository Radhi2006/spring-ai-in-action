spring.application.name=board-game-buddy
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Spring AI - OpenAI starter
# Mode DEMO: ChatClient diarahkan ke MockAiController (API tiruan yang
# formatnya sama dengan OpenAI /v1/chat/completions) di aplikasi ini
# sendiri, sehingga tidak perlu API key / internet / biaya.
#
# Untuk memakai OpenAI asli: jalankan dengan profile "openai" dan set
# environment variable SPRING_AI_OPENAI_API_KEY=sk-...
#   gradlew bootRun --args="--spring.profiles.active=openai"
# ------------------------------------------------------------------
spring.ai.openai.base-url=http://localhost:${server.port}/mock-ai
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
